<!-- args: title author translator year originalYear olWork wikidataItem -->
<!-- h-cite spec: https://microformats.org/wiki/h-cite -->
<!-- Open Library API: https://openlibrary.org/dev/docs/api/books -->
<span class="h-cite book">
    <span class="p-author h-card">{{ .Get "author" }}</span>,
    <cite class="p-name">
        <em>{{ .Get "title" }}</em>
    </cite>
    {{ if .Get "translator" }}
        (translated by {{ . }}, <time class="dt-published">{{ .Get "year" }}</time> [{{ .Get "originalYear" }}])
    {{ else }}
        (<time class="dt-published">{{ .Get "year" }}</time>)
    {{ end }}
    {{ with .Get "wikidataItem" }}
        &middot; <small><em><a class="u-url" href="https://www.wikidata.org/wiki/{{ . }}">Wikidata</a></em></small>
    {{ end }}
    {{ with .Get "olWork" }}
        &middot; <small><em><a class="u-url" href="https://openlibrary.org/works/{{ . }}">Open Library</a></em></small>
    {{ end }}
</span>
